services:
  postgres:
    # Imagen con pgvector pre-instalado — necesario para embeddings semanticos.
    image: pgvector/pgvector:pg16
    container_name: devocional_postgres
    environment:
      POSTGRES_USER: devocional
      POSTGRES_PASSWORD: devocional_local
      POSTGRES_DB: devocional
    ports:
      # Solo localhost: la contraseña de dev es publica (esta en el repo), asi
      # que la DB no debe quedar accesible desde la red local.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devocional -d devocional"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
