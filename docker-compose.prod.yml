# Topologia asumida:
#  - Postgres vive en otro CT del Proxmox (no en este compose).
#  - Redis vive en otro CT (opcional, todavia no consumido por la app).
#  - Cloudflare Tunnel apunta http://<ip-app-ct>:3000 → expone el dominio publico.
#  - Este compose corre solo en el CT de la app.
#
# Variables que tienen que estar en `.env.production`:
#   DATABASE_URL=postgresql://user:pass@<ip-postgres-ct>:5432/devocional?schema=public
#   BETTER_AUTH_SECRET=...   (openssl rand -base64 32)
#   BETTER_AUTH_URL=https://devocional.app
#   NEXT_PUBLIC_APP_URL=https://devocional.app
#   CRON_SECRET=...          (openssl rand -base64 32)
#   SMTP_*=...
#   STRIPE_/MERCADOPAGO_/PAYPAL_=...
#
# Una sola vez, en el directorio del repo: `ln -s .env.production .env`.
# Compose lee `.env` para interpolar ${NEXT_PUBLIC_APP_URL} en los build args.
# (.env no entra a la imagen: .dockerignore excluye todos los .env*.)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:?falta NEXT_PUBLIC_APP_URL (ejecuta ln -s .env.production .env)}"
    image: devocional/app:latest
    container_name: devo_app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    # Migraciones al arrancar + server. Si fallan las migraciones, el container
    # se cae y restart unless-stopped reintenta. `prisma` es el CLI global que
    # instala el Dockerfile (con npx no se encuentra el bin en standalone).
    command: sh -c "prisma migrate deploy && node server.js"
    ports:
      # 3000 escuchando en todas las interfaces del CT — el firewall del CT
      # (o de Proxmox) deberia limitar el acceso a la red interna + cloudflared.
      # Si cloudflared corre en este mismo CT, puedes restringir a 127.0.0.1:3000.
      - "3000:3000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Seeds (libros, Biblia, estados, clasificacion, planes…). No arranca con `up`;
  # se corre a mano:
  #   docker compose -f docker-compose.prod.yml run --rm seed
  #   docker compose -f docker-compose.prod.yml run --rm seed npx tsx prisma/seed/seed-planes.ts
  # La imagen final no trae tsx ni el codigo de los seeds, asi que usa la etapa
  # `builder` del Dockerfile (codigo + node_modules completos, sin ningun .env).
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:?falta NEXT_PUBLIC_APP_URL (ejecuta ln -s .env.production .env)}"
    image: devocional/seed:latest
    profiles: ["seed"]
    env_file:
      - .env.production
    environment:
      # Bloquea seed-usuarios-demo.ts (contraseñas publicas).
      NODE_ENV: production
    command: npx tsx prisma/seed/index.ts
